# Points :latest at an already-published version, by digest.
#
# This is the second half of the publish flow. When a build changes how the
# artifact is composed, publish it with move_latest=false, verify the NAS
# actually runs it, then promote here. Rebuilding to move the tag would
# produce a different digest for a version that is already published and
# running -- one tag, two images -- so this retags the existing manifest
# instead of building anything.
name: promote to latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Already-published version to promote (e.g. 0.11.2)"
        required: true
        type: string

concurrency:
  group: build-publish
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the version exists before moving anything
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/epheterson/icloud-docker-plus:${{ inputs.version }}" > /dev/null

      - name: Point latest at that manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/epheterson/icloud-docker-plus:latest \
            "ghcr.io/epheterson/icloud-docker-plus:${{ inputs.version }}"
          echo "latest -> ${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show what latest resolves to
        run: |
          docker buildx imagetools inspect \
            ghcr.io/epheterson/icloud-docker-plus:latest | head -5
