# Builds the plus image from source and publishes it to GHCR.
#
# This replaces hand-building on the NAS. Every version from 0.10.1 to 0.11.1
# was built there as an overlay (FROM the last published image + COPY of
# individual files) and never pushed, so the running image existed on one disk
# and could not be rebuilt from anywhere else. This builds plus/live's own
# root Dockerfile instead -- a real source build.
name: build and publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 0.11.2)"
        required: true
        type: string
      move_latest:
        description: "Also move :latest to this build"
        required: false
        default: true
        type: boolean

concurrency:
  # Two publishes racing would leave :latest pointing at whichever finished
  # last rather than whichever was intended.
  group: build-publish
  cancel-in-progress: false

jobs:
  test:
    # Never publish an image whose tree does not pass. The NAS pulls what this
    # produces.
    uses: ./.github/workflows/test-plus-live.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out plus/live
        uses: actions/checkout@v4
        with:
          repository: epheterson/icloud-docker
          ref: plus/live

      - name: Record what was built
        id: prov
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built from plus/live @ $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The NAS is amd64 and has no buildx; building here is the whole point.
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/epheterson/icloud-docker-plus:${{ inputs.version }}
            ${{ inputs.move_latest && 'ghcr.io/epheterson/icloud-docker-plus:latest' || '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.prov.outputs.sha }}
            org.opencontainers.image.source=https://github.com/epheterson/icloud-docker
          cache-from: type=gha
          cache-to: type=gha,mode=max
